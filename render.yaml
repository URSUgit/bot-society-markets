services:
  - type: web
    name: bitprivat-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m api.app.jobs db-upgrade && python -m uvicorn api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: BSM_ENVIRONMENT_NAME
        value: production
      - key: BSM_DEPLOYMENT_TARGET
        value: render-free
      - key: BSM_SITE_HOME_PAGE
        value: dashboard
      - key: BSM_SEED_DEMO_DATA
        value: "false"
      - key: BSM_MARKET_PROVIDER
        value: coingecko
      - key: BSM_COINGECKO_PLAN
        value: demo
      - key: BSM_SIGNAL_PROVIDER
        value: rss
      - key: BSM_TRACKED_COIN_IDS
        value: bitcoin,ethereum,solana
      - key: BSM_ALERT_INBOX_LIMIT
        value: "10"
      - key: BSM_SESSION_TTL_HOURS
        value: "168"
      - key: BSM_NOTIFICATION_RETRY_LIMIT
        value: "25"
      - key: BSM_NOTIFICATION_MAX_ATTEMPTS
        value: "4"
      - key: BSM_NOTIFICATION_RETRY_BASE_SECONDS
        value: "300"
      - key: BSM_DATABASE_URL
        fromDatabase:
          name: bitprivat-db
          property: connectionString
      - key: NVIDIA_API_KEY
        sync: false
      - key: BSM_RSS_FEED_URLS
        sync: false
      - key: BSM_TELEGRAM_BOT_TOKEN
        sync: false
      - key: BSM_TELEGRAM_CHAT_ID
        sync: false

databases:
  - name: bitprivat-db
    plan: free
    databaseName: bitprivat
    user: bitprivat
